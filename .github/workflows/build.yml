name: Lumora - Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: lumora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Lumora APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ℹ️ Show Flutter version
        run: flutter --version

      - name: 🔨 Build release APK
        run: bash ci/build.sh

      - name: 🚨 Show build errors
        if: failure()
        run: bash ci/errors.sh

      - name: 🏷️ Rename APK with version
        if: success()
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "Lumora-v${VERSION}.apk"
          echo "APK_NAME=Lumora-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "### ✅ Lumora v${VERSION} build সফল হয়েছে" >> "$GITHUB_STEP_SUMMARY"
          echo "নিচের Artifacts অংশ থেকে **lumora-apk** ডাউনলোড করুন।" >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumora-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30
          if-no-files-found: error
