name: Lumora - Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: lumora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Lumora APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Unzip project if uploaded as zip
        run: |
          if [ -z "$(find . -name pubspec.yaml -not -path './.git/*' | head -n 1)" ]; then
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "Zip found: $ZIP"
              mkdir -p unzipped_project
              unzip -o -q "$ZIP" -d unzipped_project
            fi
          fi

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find . -name pubspec.yaml -not -path "./.git/*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found (neither in repo nor in a zip)"
            find . -not -path "./.git/*" | head -n 50
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          test -d "$DIR/lib"    || { echo "::error::lib folder missing";    exit 1; }
          test -d "$DIR/assets" || { echo "::error::assets folder missing"; exit 1; }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Gradle init script (compileSdk 36, lint off)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith('lint')) { t.enabled = false }
              }
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      try {
                          def a = p.android
                          def cur = a.compileSdk
                          if (cur == null || cur < 36) { a.compileSdk = 36 }
                      } catch (Throwable t) {
                          println "force-sdk: skipped ${p.name}: ${t.message}"
                      }
                  }
              }
          }
          EOF

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --project-name lumora --org com.lumora .

      - name: Remove default test (it breaks analyze)
        working-directory: ${{ env.PROJECT_DIR }}
        run: rm -rf test

      - name: Fix Dart code (Intent clash + missing Api methods)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import re, sys

          # ---- 1) Intent name clash: rename our enum to UserIntent ----
          p = 'lib/intent.dart'
          s = open(p, encoding='utf-8').read()
          if re.search(r'\benum Intent\b', s):
              s = re.sub(r'\bIntent\b', 'UserIntent', s)
              open(p, 'w', encoding='utf-8').write(s)
              c = open('lib/chat_page.dart', encoding='utf-8').read()
              c = re.sub(r'\bIntent\.(chat|image|web|deep)\b', r'UserIntent.\1', c)
              open('lib/chat_page.dart', 'w', encoding='utf-8').write(c)
              print('patched: Intent -> UserIntent')

          # ---- 2) Api.quick / Api.testChat / Api.friendly were missing ----
          p = 'lib/api.dart'
          s = open(p, encoding='utf-8').read()
          if 'static String friendly(' not in s:
              add = r"""
            /// Short non-streaming call for tiny helper tasks (model routing etc.).
            static Future<String> quick(String model, String system, String user) =>
                complete(model, system, user, maxTokens: 300, secs: 25);

            /// Sends a tiny message to check that chat really works. Returns the model used.
            static Future<String> testChat() async {
              var list = cached;
              if (list.isEmpty) list = await models();
              final chatModels = list.where((m) => !isImageModel(m)).toList();
              if (chatModels.isEmpty) {
                throw Exception('No chat model found on this server.');
              }
              Object? last;
              for (final m in chatModels.take(3)) {
                try {
                  await complete(m, 'Reply with one word.', 'Say OK.',
                      maxTokens: 64, secs: 30);
                  return m;
                } catch (e) {
                  last = e;
                }
              }
              throw last ?? Exception('Chat test failed.');
            }

            /// Turns a raw error text into a short, readable message.
            static String friendly(String raw, [String? model]) {
              final t = raw
                  .replaceFirst(RegExp(r'^Error:\s*'), '')
                  .replaceFirst('Exception: ', '')
                  .trim();
              final who = model == null ? '' : ' ($model)';
              final m = RegExp(r'HTTP (\d{3})').firstMatch(t);
              final code = m == null ? 0 : int.parse(m.group(1)!);
              final detail = t.length > 220 ? '${t.substring(0, 220)}...' : t;
              String msg;
              if (code == 401 || code == 403) {
                msg = 'The API key was rejected. Check your key.';
              } else if (code == 404) {
                msg = 'Model or URL not found. Check the model name and Base URL.';
              } else if (code == 429) {
                msg = 'Too many requests, or your quota is finished. Wait and try again.';
              } else if (code >= 500) {
                msg = 'The server had a problem. Try again shortly.';
              } else if (t.contains('SocketException') ||
                  t.contains('ClientException') ||
                  t.contains('Failed host lookup')) {
                msg = 'Cannot reach the server. Check your internet and Base URL.';
              } else if (t.contains('TimeoutException')) {
                msg = 'The server took too long to respond.';
              } else {
                return 'Error: $detail$who';
              }
              return 'Error: $msg$who\n$detail';
            }
          """
              s = s.rstrip()
              if not s.endswith('}'):
                  sys.exit('api.dart does not end with }')
              s = s[:-1].rstrip() + '\n' + add + '}\n'
              open(p, 'w', encoding='utf-8').write(s)
              print('patched: Api.quick / testChat / friendly added')
          PY

      - name: Patch AndroidManifest and Gradle memory
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          perms = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                   '    ')
          s = s.replace('<application', perms + '<application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Lumora"', s, count=1)
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)

          intents = ('<intent><action android:name="android.speech.RecognitionService"/></intent>\n'
                     '        <intent><action android:name="android.support.customtabs.action.CustomTabsService"/></intent>')
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>\n        ' + intents, 1)
          else:
              s = s.replace('<application', '<queries>\n        ' + intents + '\n    </queries>\n    <application', 1)

          activity = ('<activity android:name="com.linusu.flutter_web_auth_2.CallbackActivity" android:exported="true">\n'
                      '            <intent-filter android:label="flutter_web_auth_2">\n'
                      '                <action android:name="android.intent.action.VIEW"/>\n'
                      '                <category android:name="android.intent.category.DEFAULT"/>\n'
                      '                <category android:name="android.intent.category.BROWSABLE"/>\n'
                      '                <data android:scheme="lumora"/>\n'
                      '            </intent-filter>\n'
                      '        </activity>\n'
                      '    </application>')
          s = s.replace('</application>', activity, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

          # GitHub runner has ~7GB RAM; the template's 8G heap can get the build killed
          G=android/gradle.properties
          touch $G
          sed -i '/^org.gradle.jvmargs/d' $G
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\n' >> $G

          cat android/app/src/main/AndroidManifest.xml

      - name: Get packages and icons
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze Dart code (fast error check)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          if grep -qE "^\s*error •" analyze.log; then
            grep -E "^\s*error •" analyze.log | head -n 10 | while IFS= read -r l; do
              echo "::error::${l:0:300}"
            done
            {
              echo "### Dart errors"
              echo '```'
              grep -E "^\s*error •" analyze.log | head -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-shrink --no-tree-shake-icons 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f build.log ]; then
